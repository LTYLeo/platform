name: Deploy static site to GitHub Pages

# The developer platform is a static site, but the repository also contains the
# FastAPI backend. GitHub Pages serves whatever is in the published artifact, so
# this workflow assembles a _site/ directory with ONLY the front-end assets and
# publishes that. Without this step, https://<user>.github.io/<repo>/server/main.py
# would be downloadable by anyone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'server' \
            --exclude '*.md' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            ./ _site/

          # Hard guarantees before we publish anything.
          test -f _site/index.html
          test -f _site/config.js
          test -f _site/locales/zh.js
          if [ -e _site/server ]; then
            echo "::error::server/ must never be published to GitHub Pages"
            exit 1
          fi

          echo "Publishing:"
          find _site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
